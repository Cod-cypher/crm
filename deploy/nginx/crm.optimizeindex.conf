# /etc/nginx/sites-available/crm.optimizeindex.conf
# Twenty CRM, run by PM2 from deploy/ecosystem.config.cjs (NODE_PORT=3020).
#
# This is the full live config, including the SSL lines certbot added on first
# setup. Apply changes with:
#   cp /opt/twenty/deploy/nginx/crm.optimizeindex.conf /etc/nginx/sites-available/
#   nginx -t && systemctl reload nginx
#
# First-time setup on a fresh server (no certificate yet): comment out the
# 443 server block, symlink into sites-enabled, then run
#   certbot certonly --nginx -d crm.optimizeindex.com
# and restore the block.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # The UI loads ~350 JS/CSS files on first paint. Over HTTP/1.1 the browser
    # fetches 6 at a time, and each round trip to this server is ~150 ms, so
    # multiplexing matters more than anything else here.
    http2 on;
    server_name crm.optimizeindex.com;

    ssl_certificate /etc/letsencrypt/live/crm.optimizeindex.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/crm.optimizeindex.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Attachments and CSV imports go through the API.
    client_max_body_size 50m;

    # Vite build output. Every filename carries a content hash, so a changed file
    # always gets a new URL and these can be cached forever. Twenty itself serves
    # them with max-age=0, which made the browser re-check all ~350 on every load.
    # Served straight from disk; anything not found falls through to Node.
    location /assets/ {
        root /opt/twenty/packages/twenty-server/dist/front;
        try_files $uri @twenty;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip on;
        gzip_types text/css application/javascript text/javascript application/json image/svg+xml font/woff2;
    }

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # GraphQL subscriptions / SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location @twenty {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.optimizeindex.com;
    return 301 https://$host$request_uri;
}
