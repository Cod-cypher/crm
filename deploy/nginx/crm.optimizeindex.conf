# /etc/nginx/sites-available/crm.optimizeindex.conf
# Twenty CRM, run by PM2 from deploy/ecosystem.config.cjs (NODE_PORT=3020).
#
# Install:
#   cp deploy/nginx/crm.optimizeindex.conf /etc/nginx/sites-available/
#   ln -sf /etc/nginx/sites-available/crm.optimizeindex.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d crm.optimizeindex.com --redirect
#
# Certbot edits the live copy in /etc/nginx to add the SSL block. Don't re-copy
# this file over it afterwards or the certificate lines are lost.

server {
    listen 80;
    listen [::]:80;
    server_name crm.optimizeindex.com;

    # Attachments and CSV imports go through the API.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # GraphQL subscriptions / SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
